<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Mapa Interactivo</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    text-align: center; 
    background: #f4f4f4;
  }

  /* Contenedor del mapa */
  .mapa-contenedor {
    max-width: 800px;
    margin: 0 auto;
    background-color: white; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  /* Estilos originales del SVG */
  .cls-1 {
    fill: #ff0;
    opacity: .5;
    stroke: #000;
    stroke-miterlimit: 10;
  }

  /* Magia CSS para los lotes controlados por JS */
  /* Lotes disponibles (Verde) */
  .lote-disponible {
    fill: rgba(46, 204, 113, 0.7) !important; /* El !important asegura que sobreescriba a .cls-1 */
    cursor: pointer;
    transition: 0.3s ease;
  }
  .lote-disponible:hover {
    fill: rgba(46, 204, 113, 1) !important;
  }

  /* Lotes vendidos o reservados (Rojo) - Sin evento hover */
  .lote-vendido {
    fill: rgba(231, 76, 60, 0.7) !important;
    cursor: not-allowed;
  }

  /* Diseño de la ventana modal (oculta por defecto) */
  .modal {
    display: none; 
    position: fixed; 
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white; 
    padding: 30px; 
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 1000;
  }
  .modal-overlay {
    display: none;
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); 
    z-index: 999;
  }
  
  button { 
    padding: 10px 20px; 
    background: #e74c3c; 
    color: white; 
    border: none;
    cursor: pointer; 
    border-radius: 5px; 
    margin-top: 15px;
  }
</style>
</head>
